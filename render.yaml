services:
  - type: web
    name: taskpulse
    env: node
    plan: free
    buildCommand: "npm --prefix frontend install && npm --prefix frontend run build && npm --prefix backend install && cd backend && npx prisma db push && npm run prisma:seed"
    startCommand: "cd backend && npx tsx src/server.ts"
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: RESET_TOKEN_EXPIRY
        value: 3600000
